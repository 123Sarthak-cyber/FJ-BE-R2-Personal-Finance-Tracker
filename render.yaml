databases:
  - name: finance-tracker-db
    databaseName: finance_tracker
    user: finance_user
    plan: free

services:
  - type: web
    name: personal-finance-tracker
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: finance-tracker-db
          property: connectionString
